<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicines</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#ff6f00;
color:white;
padding:15px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
padding:15px;
text-align:center;
}

.card img{
width:150px;
height:150px;
object-fit:contain;
}

.name{
font-size:20px;
font-weight:bold;
margin:10px 0;
}

.price{
color:green;
font-size:22px;
font-weight:bold;
}

.use{
color:#444;
margin:10px 0;
}

.qty{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin:15px 0;
}

.qty button{
width:35px;
height:35px;
font-size:20px;
background:#ff6f00;
color:white;
border:none;
border-radius:50%;
}

.action button{
margin:5px;
padding:10px 15px;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

.cart{
background:#ff9800;
}

.buy{
background:#4caf50;
}
</style>

</head>
<body>

<header>
🏥 Ravi Online Medical Store
</header>

<div class="container">

<div class="card">
<img src="images/paracetamol.jpg">
<div class="name">Paracetamol 650</div>
<div class="price">₹35</div>
<div class="use">उपयोग: बुखार, सिरदर्द और बदन दर्द।</div>

<div class="qty">
<button onclick="minus(this)">-</button>
<span>1</span>
<button onclick="plus(this)">+</button>
</div>

<div class="action">
<button class="cart">Add Cart</button>
<button class="buy">Buy Now</button>
</div>

</div>

<div class="card">
<img src="images/dolo650.jpg">
<div class="name">Dolo 650</div>
<div class="price">₹32</div>
<div class="use">उपयोग: बुखार और दर्द।</div>

<div class="qty">
<button onclick="minus(this)">-</button>
<span>1</span>
<button onclick="plus(this)">+</button>
</div>

<div class="action">
<button class="cart">Add Cart</button>
<button class="buy">Buy Now</button>
</div>

</div>

<div class="card">
<img src="images/cetirizine.jpg">
<div class="name">Cetirizine</div>
<div class="price">₹28</div>
<div class="use">उपयोग: एलर्जी, छींक और खुजली।</div>

<div class="qty">
<button onclick="minus(this)">-</button>
<span>1</span>
<button onclick="plus(this)">+</button>
</div>

<div class="action">
<button class="cart">Add Cart</button>
<button class="buy">Buy Now</button>
</div>

</div>

<div class="card">
<img src="images/vitaminc.jpg">
<div class="name">Vitamin C</div>
<div class="price">₹85</div>
<div class="use">उपयोग: रोग प्रतिरोधक क्षमता बढ़ाने में।</div>

<div class="qty">
<button onclick="minus(this)">-</button>
<span>1</span>
<button onclick="plus(this)">+</button>
</div>

<div class="action">
<button class="cart">Add Cart</button>
<button class="buy">Buy Now</button>
</div>

</div>

</div>

<script>
function plus(btn){
let s=btn.parentElement.querySelector("span");
s.innerHTML=parseInt(s.innerHTML)+1;
}

function minus(btn){
let s=btn.parentElement.querySelector("span");
let q=parseInt(s.innerHTML);
if(q>1)s.innerHTML=q-1;
}
</script>

</body>
</html>
