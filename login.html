<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Ravi Online Medical Store</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff3e0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:#fff;
width:90%;
max-width:400px;
padding:25px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#ff6f00;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#ff6f00;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#e65100;
}

.link{
text-align:center;
margin-top:15px;
cursor:pointer;
color:#ff6f00;
font-weight:bold;
}

#register{
display:none;
}
</style>
</head>

<body>

<div class="container">

<div id="login">

<h2>👤 Login</h2>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button onclick="alert('Firebase Part 3 में जोड़ा जाएगा')">
Login
</button>

<div class="link" onclick="showRegister()">
New User? Register
</div>

</div>

<div id="register">

<h2>📝 Registration</h2>

<input type="text" placeholder="Full Name">

<input type="tel" placeholder="Mobile Number">

<input type="email" placeholder="Email">

<input type="password" placeholder="Create Password">

<button onclick="alert('Registration Firebase Part 3 में जोड़ा जाएगा')">
Register
</button>

<div class="link" onclick="showLogin()">
Already Registered? Login
</div>

</div>

</div>

<script>

function showRegister(){
document.getElementById("login").style.display="none";
document.getElementById("register").style.display="block";
}

function showLogin(){
document.getElementById("register").style.display="none";
document.getElementById("login").style.display="block";
}

</script>

</body>
</html>
