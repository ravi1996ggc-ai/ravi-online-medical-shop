<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Ravi Online Medical Store</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#ff6f00;
color:#fff;
padding:15px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
max-width:900px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
background:#ff6f00;
color:#fff;
border:none;
padding:12px 20px;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table,th,td{
border:1px solid #ddd;
}

th{
background:#ff6f00;
color:#fff;
padding:10px;
}

td{
padding:10px;
text-align:center;
}
</style>
</head>

<body>

<header>
🏥 Ravi Online Medical Store - Admin Panel
</header>

<div class="container">

<h2>नई दवा जोड़ें</h2>

<input type="text" placeholder="दवा का नाम">

<input type="number" placeholder="कीमत">

<input type="number" placeholder="स्टॉक">

<input type="text" placeholder="Image URL">

<textarea placeholder="हिंदी में उपयोग"></textarea>

<button onclick="alert('Firebase Part 7 में जोड़ा जाएगा')">
दवा जोड़ें
</button>

<h2>Orders</h2>

<table>

<tr>
<th>Order ID</th>
<th>Customer</th>
<th>Medicine</th>
<th>Amount</th>
<th>Status</th>
</tr>

<tr>
<td>#1001</td>
<td>Ravi</td>
<td>Paracetamol</td>
<td>₹35</td>
<td>Pending</td>
</tr>

<tr>
<td>#1002</td>
<td>Amit</td>
<td>Dolo 650</td>
<td>₹64</td>
<td>Delivered</td>
</tr>

</table>

</div>

</body>
</html>
