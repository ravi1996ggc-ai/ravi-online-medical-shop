<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravi Online Medical Store Dashboard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f5f5;}

header{
background:#ff6f00;
color:white;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.top{
display:flex;
justify-content:space-between;
padding:15px;
}

button{
background:#ff6f00;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.search{
padding:15px;
text-align:center;
}

.search input{
width:90%;
max-width:500px;
padding:12px;
font-size:18px;
border:2px solid #ff6f00;
border-radius:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
padding:15px;
}

.card{
background:white;
padding:20px;
text-align:center;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.2);
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.card:hover{
background:#ffe0b2;
}

footer{
margin-top:20px;
background:#222;
color:white;
padding:15px;
text-align:center;
}
</style>
</head>

<body>

<header>
🏥 Ravi Online Medical Store
</header>

<div class="top">
<h3>Welcome User</h3>
<button onclick="logout()">Logout</button>
</div>

<div class="search">
<input type="text" placeholder="🔍 दवा खोजें...">
</div>

<div class="grid">

<div class="card">🤒 Fever</div>

<div class="card">💊 Antibiotic</div>

<div class="card">🩺 BP Medicine</div>

<div class="card">🩸 Diabetes</div>

<div class="card">❤️ Heart Care</div>

<div class="card">🧠 Brain</div>

<div class="card">🦴 Calcium</div>

<div class="card">💪 Vitamin</div>

<div class="card">👶 Baby Care</div>

<div class="card">👩 Women Care</div>

<div class="card">🧴 Skin Care</div>

<div class="card">🩹 First Aid</div>

</div>

<footer>

© 2026 Ravi Online Medical Store

</footer>

<script>
function logout(){
alert("Logout Successfully");
window.location="login.html";
}
</script>

</body>
</html>
