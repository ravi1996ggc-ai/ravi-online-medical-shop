<!DOCTYPE html>
<html>

<head>

<title>Ravi Online Medical Shop Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{
margin:0;
font-family:Arial;
background:#fff3e0;
}


.header{

background:linear-gradient(135deg,#ff9800,#ff5722);
color:white;
padding:20px;
text-align:center;
font-size:25px;
font-weight:bold;

}


.search{

text-align:center;
margin:20px;

}


input{

width:85%;
padding:15px;
border-radius:25px;
border:2px solid orange;
font-size:16px;

}



.card{

background:white;
margin:15px;
padding:20px;
border-radius:20px;
box-shadow:0 0 10px #aaa;

}


button{

background:#ff6d00;
color:white;
border:none;
padding:12px 25px;
border-radius:25px;
font-size:16px;

}


.grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:15px;

}


.box{

background:white;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 0 10px #aaa;

}


.footer{

background:#e65100;
color:white;
text-align:center;
padding:15px;

}


</style>


</head>


<body>


<div class="header">

🩺 RAVI ONLINE<br>
MEDICAL SHOP

<br>
<small>Dashboard</small>

</div>



<div class="search">

<input placeholder="🔍 Search Medicine">

</div>




<div class="grid">


<div class="box">
💊
<h3>All Medicine</h3>
</div>


<div class="box">
🩹
<h3>Health Care</h3>
</div>


<div class="box">
🧴
<h3>Personal Care</h3>
</div>


<div class="box">
🚑
<h3>Emergency</h3>
</div>


</div>




<div class="card">

<h2>Welcome User 👋</h2>

<p>
Order your medicine online easily.
</p>


<button>
ORDER MEDICINE
</button>


</div>




<div class="card">

<h2>Services</h2>

<p>✅ Home Delivery</p>
<p>✅ Medicine Availability</p>
<p>✅ Online Support</p>


</div>




<div class="footer">

© 2026 Ravi Online Medical Shop

</div>


</body>

</html>
