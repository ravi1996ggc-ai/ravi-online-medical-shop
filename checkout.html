<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Ravi Online Medical Store</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#ff6f00;
color:#fff;
text-align:center;
padding:15px;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

h2{
color:#ff6f00;
}

input,textarea,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.total{
font-size:22px;
color:green;
font-weight:bold;
margin:15px 0;
}

button{
width:100%;
padding:14px;
background:#ff6f00;
color:white;
border:none;
border-radius:8px;
font-size:18px;
margin-top:10px;
cursor:pointer;
}

button:hover{
background:#e65100;
}
</style>
</head>

<body>

<header>
🛒 Checkout
</header>

<div class="container">

<h2>Delivery Address</h2>

<input type="text" placeholder="पूरा नाम">

<input type="tel" placeholder="मोबाइल नंबर">

<textarea placeholder="पूरा पता"></textarea>

<input type="text" placeholder="पिन कोड">

<h2>Payment Method</h2>

<select>
<option>UPI</option>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Net Banking</option>
<option>Cash on Delivery</option>
</select>

<div class="total">
कुल राशि : ₹499
</div>

<button onclick="order()">
Place Order
</button>

</div>

<script>

function order(){

alert("🎉 आपका ऑर्डर सफलतापूर्वक दर्ज हो गया।");

}

</script>

</body>
</html>
